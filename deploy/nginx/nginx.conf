# =====================================================================
# agent · Nginx 主配置
# =====================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;
    server_tokens   off;

    keepalive_timeout     65;
    keepalive_requests    1000;

    # 上传 PDF / 超大请求体（Agent 文件上传链路）
    client_max_body_size      100m;
    client_body_buffer_size   1m;

    # ---------------- 请求 ID 贯通 ----------------
    # 客户端带 X-Request-ID 就沿用；没带则由 nginx 生成 $request_id 并透传给后端，
    # 使 nginx 访问日志的 rid= 与后端 JSON 日志的 request_id **一一对应**。
    map $http_x_request_id $agent_request_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # ---------------- 限流（生产默认）----------------
    # /api/ 的限流区：按客户端 IP 计数（$binary_remote_addr，内存占用更小）
    limit_req_zone  $binary_remote_addr zone=agent_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=agent_conn:10m;
    # 超限返回 429（默认是 503，前端/监控更好识别）
    limit_req_status  429;
    limit_conn_status 429;

    # ---------------- Gzip ----------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_buffers      16 8k;
    gzip_types        text/plain text/css text/xml application/xml application/xml+rss
                      application/json application/javascript application/x-javascript
                      text/javascript image/svg+xml application/wasm application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
