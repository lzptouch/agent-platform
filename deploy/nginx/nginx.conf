# =====================================================================
# Agent Platform · Nginx 主配置
# =====================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;
    server_tokens   off;

    keepalive_timeout     65;
    keepalive_requests    1000;

    # 上传 PDF / 超大请求体（Agent 文件上传链路）
    client_max_body_size      100m;
    client_body_buffer_size   1m;

    # ---------------- Gzip ----------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_buffers      16 8k;
    gzip_types        text/plain text/css text/xml application/xml application/xml+rss
                      application/json application/javascript application/x-javascript
                      text/javascript image/svg+xml application/wasm application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
