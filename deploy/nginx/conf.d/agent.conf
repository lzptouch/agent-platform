# =====================================================================
# agent · 站点配置
#
#   /                 → 前端静态资源（frontend/web/vue-element-plus 的 SPA 构建产物）
#   /api/v1/*         → 反向代理到 backend:8000（SSE 流式：关闭缓冲）
#   /docs /redoc      → 后端 OpenAPI 文档（可选，生产可关闭）
#
# 使用 Docker 内嵌 DNS（127.0.0.11）+ 变量形式的 proxy_pass，
# 使得 backend 容器重建后 IP 变化也能自动重新解析。
# =====================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---------------------------------------------------------------
    # 代理通用参数
    # ---------------------------------------------------------------
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Host  $host;
    proxy_set_header        Connection        "";
    proxy_set_header        X-Request-ID      $agent_request_id;

    proxy_connect_timeout   10s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;   # SSE / 深度研究任务可能长时间无数据

    # SSE 必须关闭缓冲，否则流式输出会被攒到最后一次性吐出
    proxy_buffering         off;
    proxy_cache             off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;

    # ---------------------------------------------------------------
    # 1) 后端 API（含 SSE 流式）
    # ---------------------------------------------------------------
    location /api/ {
        set $ap_backend backend:8000;
        proxy_pass http://$ap_backend$request_uri;

        # 限流（生产默认）：单 IP 20 r/s，突发 40 不排队；并发连接上限 50
        limit_req  zone=agent_api burst=40 nodelay;
        limit_conn agent_conn 50;

        gzip off;                                   # SSE 不要二次压缩
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;   # 告诉下游（含浏览器）不要缓冲

        # 错误时透传给前端可见
        proxy_intercept_errors off;
    }

    location = /api {
        set $ap_backend backend:8000;
        proxy_pass http://$ap_backend$request_uri;
    }

    # ---------------------------------------------------------------
    # 2) OpenAPI 文档：**生产默认关闭**（返回 404，不泄露接口结构）
    #
    #    重新打开（仅限本地调试，勿用于生产）：
    #      a) 注释/删除下面 4 个 404 location；
    #      b) 把下面「重新打开」的示例 location 取消注释；
    #      c) docker compose restart web
    # ---------------------------------------------------------------
    location = /docs         { return 404; }
    location = /docs-info    { return 404; }
    location = /redoc        { return 404; }
    location = /openapi.json { return 404; }

    # ---- 重新打开（调试用）----
    # location = /docs {
    #     set $ap_backend backend:8000;
    #     proxy_pass http://$ap_backend$request_uri;
    # }
    # location = /docs-info {
    #     set $ap_backend backend:8000;
    #     proxy_pass http://$ap_backend$request_uri;
    # }
    # location = /redoc {
    #     set $ap_backend backend:8000;
    #     proxy_pass http://$ap_backend$request_uri;
    # }
    # location = /openapi.json {
    #     set $ap_backend backend:8000;
    #     proxy_pass http://$ap_backend$request_uri;
    # }

    # ---------------------------------------------------------------
    # 3) 带 hash 的构建产物：长缓存
    # ---------------------------------------------------------------
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------------------------------------------------------------
    # 4) Vue SPA 路由回退：非 /api 的未命中路径一律回 index.html
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # 5) Nginx 自身健康检查
    # ---------------------------------------------------------------
    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
