# =====================================================================
# agent · 可选：独立 Milvus 向量数据库集群
#
# 默认形态用 Milvus Lite（data/milvus.db 单文件，零额外容器）。
# 需要「正式版 Milvus」（多容器共享、独立扩容、可视化 attu 等）时启用本覆盖文件：
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.milvus.yml up -d
#
# 它会做两件事：
#   1) 拉起 etcd（元数据存储）+ minio（对象存储）+ milvus standalone（向量引擎）
#   2) 把 backend 的 MILVUS_DB_PATH 切到 http://milvus:19530
#
# 注意：切换后原来的 data/milvus.db 数据不会自动迁移，需要重新执行入库：
#   docker compose exec backend python -m scripts.ingest_data
# =====================================================================

name: agent

services:

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: agent-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://milvus-etcd:2379
    volumes:
      - etcd-data:/etcd
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    networks:
      - agent
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-36-18Z
    container_name: agent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.4
    container_name: agent-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - agent
    expose:
      - "19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 3

  # 覆盖主编排里的 backend：改为连接 Milvus standalone
  backend:
    environment:
      MILVUS_DB_PATH: "http://milvus:19530"
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HOST: "0.0.0.0"
      PORT: "8000"
      MILVUS_COLLECTION: "hybrid_demo"
      RESEARCH_OUTPUT_DIR: "data/research"
      RUN_INGEST: "false"
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  etcd-data:
    name: agent-etcd-data
  minio-data:
    name: agent-minio-data
  milvus-data:
    name: agent-milvus-data
