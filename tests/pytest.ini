[pytest]
testpaths = .
python_files = test_*.py
addopts = --basetemp=.pytest_tmp
# P5-03：5 个分层 marker（与 backend/pyproject.toml **同源**）
markers =
    unit: 纯函数 / 单类单元测试（无 IO、无子进程）
    integration: 依赖 DB、调度、子进程的集成测试
    e2e: 端到端测试（Playwright / 真实进程）
    slow: 耗时较长（>30s）的用例
    real_llm: 需要真实 LLM 凭证的用例（默认 skip，需显式开启）
