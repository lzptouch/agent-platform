<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2c3e50">LlamaIndex + Milvus + BGE 的 RAG 系统架构</text>
  
  <!-- 阶段分隔线和标签 -->
  <line x1="50" y1="120" x2="1150" y2="120" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#34495e">系统流程</text>
  
  <!-- 1. 文档加载和处理阶段 -->
  <g id="document-loading">
    <!-- 本地文档 -->
    <rect x="100" y="150" width="120" height="100" rx="5" ry="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="160" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">本地文档</text>
    <text x="160" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">(PDF, TXT等)</text>
    
    <!-- 文档加载器 -->
    <rect x="300" y="150" width="140" height="100" rx="5" ry="5" fill="#d6eaf8" stroke="#85c1e9" stroke-width="2"/>
    <text x="370" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">文档加载器</text>
    <text x="370" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2980b9">(LlamaIndex)</text>
    
    <!-- 文档分块 -->
    <rect x="520" y="150" width="140" height="100" rx="5" ry="5" fill="#d6eaf8" stroke="#85c1e9" stroke-width="2"/>
    <text x="590" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">文档分块</text>
    <text x="590" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2980b9">(TextSplitter)</text>
    
    <!-- 连接箭头 -->
    <line x1="220" y1="200" x2="300" y2="200" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="300,200 290,195 290,205" fill="#7f8c8d"/>
    
    <line x1="440" y1="200" x2="520" y2="200" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="520,200 510,195 510,205" fill="#7f8c8d"/>
  </g>
  
  <!-- 2. 嵌入向量生成阶段 -->
  <g id="embedding-generation">
    <!-- BGE Embedding模型 -->
    <rect x="700" y="150" width="160" height="100" rx="5" ry="5" fill="#d5f5e3" stroke="#82e0aa" stroke-width="2"/>
    <text x="780" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">BGE Embedding</text>
    <text x="780" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60">生成文本向量</text>
    
    <!-- 向量数据管理 -->
    <rect x="940" y="150" width="160" height="100" rx="5" ry="5" fill="#fadbd8" stroke="#f5b7b1" stroke-width="2"/>
    <text x="1020" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">向量序列化</text>
    <text x="1020" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#c0392b">向量+元数据</text>
    
    <!-- 连接箭头 -->
    <line x1="660" y1="200" x2="700" y2="200" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="700,200 690,195 690,205" fill="#7f8c8d"/>
    
    <line x1="860" y1="200" x2="940" y2="200" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="940,200 930,195 930,205" fill="#7f8c8d"/>
  </g>
  
  <!-- 3. Milvus向量数据库部分 -->
  <g id="milvus-database">
    <!-- Milvus 数据库 -->
    <rect x="600" y="320" width="240" height="150" rx="10" ry="10" fill="#fdebd0" stroke="#f39c12" stroke-width="3"/>
    <text x="720" y="360" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Milvus 向量数据库</text>
    <line x1="630" y1="380" x2="810" y2="380" stroke="#e67e22" stroke-width="2"/>
    
    <!-- Milvus 内部组件 -->
    <rect x="630" y="395" width="80" height="55" rx="5" ry="5" fill="#f5cba7" stroke="#d35400" stroke-width="1"/>
    <text x="670" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">集合</text>
    
    <rect x="730" y="395" width="80" height="55" rx="5" ry="5" fill="#f5cba7" stroke="#d35400" stroke-width="1"/>
    <text x="770" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">索引</text>
    
    <!-- 连接箭头 -->
    <line x1="1020" y1="250" x2="1020" y2="290" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="1020" y1="290" x2="830" y2="320" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="830,320 838,316 840,325" fill="#7f8c8d"/>
    
    <text x="920" y="300" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">存储文档向量</text>
  </g>
  
  <!-- 4. 查询处理流程 -->
  <g id="query-flow">
    <!-- 用户查询 -->
    <rect x="100" y="400" width="140" height="80" rx="40" ry="40" fill="#d6eaf8" stroke="#3498db" stroke-width="2"/>
    <text x="170" y="445" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">用户查询</text>
    
    <!-- 查询分析 -->
    <rect x="300" y="400" width="140" height="80" rx="5" ry="5" fill="#d5f5e3" stroke="#82e0aa" stroke-width="2"/>
    <text x="370" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">查询处理</text>
    <text x="370" y="455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60">(LlamaIndex)</text>
    
    <!-- 连接箭头 -->
    <line x1="240" y1="440" x2="300" y2="440" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="300,440 290,435 290,445" fill="#7f8c8d"/>
  </g>
  
  <!-- 5. 查询向量化 -->
  <g id="query-embedding">
    <!-- BGE查询向量化 -->
    <rect x="300" y="520" width="140" height="80" rx="5" ry="5" fill="#d5f5e3" stroke="#82e0aa" stroke-width="2"/>
    <text x="370" y="550" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">查询向量化</text>
    <text x="370" y="575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60">(BGE模型)</text>
    
    <!-- 连接箭头 -->
    <line x1="370" y1="480" x2="370" y2="520" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="370,520 365,510 375,510" fill="#7f8c8d"/>
  </g>
  
  <!-- 6. 向量检索 -->
  <g id="vector-retrieval">
    <!-- 向量检索 -->
    <rect x="500" y="520" width="140" height="80" rx="5" ry="5" fill="#fdebd0" stroke="#f39c12" stroke-width="2"/>
    <text x="570" y="550" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">相似度检索</text>
    <text x="570" y="575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d35400">(ANN搜索)</text>
    
    <!-- 连接箭头 -->
    <line x1="440" y1="560" x2="500" y2="560" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="500,560 490,555 490,565" fill="#7f8c8d"/>
    
    <!-- Milvus 到 检索 -->
    <line x1="600" y1="400" x2="570" y2="520" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="570,520 567,510 577,513" fill="#7f8c8d"/>
  </g>
  
  <!-- 7. 内容整合和回答生成 -->
  <g id="response-generation">
    <!-- 相关段落提取 -->
    <rect x="700" y="520" width="140" height="80" rx="5" ry="5" fill="#ebdef0" stroke="#c39bd3" stroke-width="2"/>
    <text x="770" y="550" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">内容检索</text>
    <text x="770" y="575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8e44ad">返回相关段落</text>
    
    <!-- LLM回答生成 -->
    <rect x="900" y="520" width="140" height="80" rx="5" ry="5" fill="#ebdef0" stroke="#c39bd3" stroke-width="2"/>
    <text x="970" y="550" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">回答生成</text>
    <text x="970" y="575" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8e44ad">(大型语言模型)</text>
    
    <!-- 连接箭头 -->
    <line x1="640" y1="560" x2="700" y2="560" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="700,560 690,555 690,565" fill="#7f8c8d"/>
    
    <line x1="840" y1="560" x2="900" y2="560" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="900,560 890,555 890,565" fill="#7f8c8d"/>
  </g>
  
  <!-- 8. 最终回答 -->
  <g id="final-answer">
    <!-- 回答展示 -->
    <rect x="500" y="650" width="200" height="100" rx="10" ry="10" fill="#d6eaf8" stroke="#3498db" stroke-width="3"/>
    <text x="600" y="700" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">返回结果给用户</text>
    
    <!-- 连接箭头 -->
    <line x1="970" y1="600" x2="970" y2="630" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="970" y1="630" x2="700" y2="680" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="700,680 710,683 707,673" fill="#7f8c8d"/>
  </g>
  
  <!-- 9. 知识库迭代更新流程 (可选) -->
  <g id="knowledge-update" opacity="0.8">
    <line x1="600" y1="650" x2="300" y2="630" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="300" y1="630" x2="300" y2="350" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="300" y1="350" x2="500" y2="200" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="500,200 492,197 495,207" fill="#95a5a6"/>
    
    <text x="320" y="380" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d" transform="rotate(-90 320,380)">知识库更新</text>
  </g>
  
  <!-- 图例 -->
  <g id="legend">
    <rect x="50" y="720" width="220" height="30" rx="5" ry="5" fill="#d6eaf8" stroke="#85c1e9" stroke-width="1"/>
    <text x="160" y="740" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">LlamaIndex流程</text>
    
    <rect x="280" y="720" width="220" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1"/>
    <text x="390" y="740" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">BGE Embedding处理</text>
    
    <rect x="510" y="720" width="220" height="30" rx="5" ry="5" fill="#fdebd0" stroke="#f39c12" stroke-width="1"/>
    <text x="620" y="740" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Milvus向量数据库</text>
    
    <rect x="740" y="720" width="220" height="30" rx="5" ry="5" fill="#ebdef0" stroke="#c39bd3" stroke-width="1"/>
    <text x="850" y="740" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">答案生成</text>
  </g>
</svg>
