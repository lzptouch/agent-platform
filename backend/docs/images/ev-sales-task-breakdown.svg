<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- 浅色背景 -->
  <rect width="1600" height="900" fill="#F5F7FA"/>
  
  <!-- 主标题 -->
  <text x="800" y="120" font-family="'Arial', sans-serif" font-size="70" font-weight="700" fill="#1A365D" text-anchor="middle">新能源车企销售培训助手</text>
  
  <!-- 副标题 -->
  <text x="800" y="180" font-family="'Arial', sans-serif" font-size="36" font-weight="500" fill="#2C5282" text-anchor="middle">赋能销售 · 提升体验 · 增加转化</text>
  
  <!-- 分隔线 -->
  <line x1="300" y1="220" x2="1300" y2="220" stroke="#2C5282" stroke-width="3"/>
  
  <!-- 内容区域 -->
  <g>
    <!-- 任务拆解标题 -->
    <text x="300" y="280" font-family="'Arial', sans-serif" font-size="45" font-weight="600" fill="#1A365D">任务拆解：</text>
    
    <!-- 任务1 -->
    <text x="300" y="360" font-family="'Arial', sans-serif" font-size="36" font-weight="600" fill="#2C5282">1. 搭建本地知识库问答系统 (RAG)</text>
    <rect x="320" y="380" width="30" height="4" fill="#2C5282"/>
    <text x="320" y="420" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">基于车企产品介绍文档构建知识库</text>
    <text x="320" y="460" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">实现精准检索和相关性排序</text>
    <text x="320" y="500" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">提供产品参数、配置和特性的准确回答</text>
    
    <!-- 任务2 -->
    <text x="300" y="560" font-family="'Arial', sans-serif" font-size="36" font-weight="600" fill="#2C5282">2. 搭建LLM+网络搜索系统</text>
    <rect x="320" y="580" width="30" height="4" fill="#2C5282"/>
    <text x="320" y="620" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">实时获取竞品信息和行业动态</text>
    <text x="320" y="660" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">整合网络搜索结果与大模型回答</text>
    <text x="320" y="700" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">提供最新市场和政策信息支持</text>
    
    <!-- 任务3 -->
    <text x="300" y="760" font-family="'Arial', sans-serif" font-size="36" font-weight="600" fill="#2C5282">3. 百万销售Agent系统</text>
    <rect x="320" y="780" width="30" height="4" fill="#2C5282"/>
    <text x="320" y="820" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">融入金牌销售的know-how，结合RAG与网络搜索</text>
    <text x="320" y="860" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#2A4365">将顶级销售经验同步给每一位销售人员</text>
  </g>
  
  <!-- 系统架构图 -->
  <g transform="translate(1300, 570)">
    <!-- 知识库 -->
    <rect x="-250" y="-220" width="180" height="80" rx="10" ry="10" fill="#EDF2F7" stroke="#2C5282" stroke-width="3"/>
    <text x="-160" y="-175" font-family="'Arial', sans-serif" font-size="24" font-weight="500" fill="#2C5282" text-anchor="middle">产品知识库</text>
    
    <!-- 网络搜索 -->
    <rect x="50" y="-220" width="180" height="80" rx="10" ry="10" fill="#EDF2F7" stroke="#2C5282" stroke-width="3"/>
    <text x="140" y="-175" font-family="'Arial', sans-serif" font-size="24" font-weight="500" fill="#2C5282" text-anchor="middle">网络搜索</text>
    
    <!-- 销售Know-how -->
    <rect x="-100" y="-100" width="180" height="80" rx="10" ry="10" fill="#EDF2F7" stroke="#2C5282" stroke-width="3"/>
    <text x="-10" y="-55" font-family="'Arial', sans-serif" font-size="24" font-weight="500" fill="#2C5282" text-anchor="middle">销售Know-how</text>
    
    <!-- 销售Agent -->
    <rect x="-100" y="20" width="180" height="80" rx="10" ry="10" fill="#EDF2F7" stroke="#2C5282" stroke-width="3" stroke-dasharray="none"/>
    <text x="-10" y="65" font-family="'Arial', sans-serif" font-size="24" font-weight="600" fill="#2C5282" text-anchor="middle">销售Agent</text>
    
    <!-- 连接线 -->
    <line x1="-160" y1="-140" x2="-75" y2="-100" stroke="#2C5282" stroke-width="2"/>
    <line x1="140" y1="-140" x2="55" y2="-100" stroke="#2C5282" stroke-width="2"/>
    <line x1="-10" y1="-20" x2="-10" y2="20" stroke="#2C5282" stroke-width="2"/>
  </g>
</svg>
