<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 外部边框 -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="#333" stroke-width="2" rx="10" ry="10"/>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">智能体</text>
  
  <!-- 思考模块 -->
  <rect x="150" y="140" width="200" height="100" fill="#d4e6f1" stroke="#333" stroke-width="2" rx="8" ry="8"/>
  <text x="250" y="175" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">思考</text>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">分析信息与规划行动</text>
  
  <!-- 行动模块 -->
  <rect x="150" y="290" width="200" height="100" fill="#d5f5e3" stroke="#333" stroke-width="2" rx="8" ry="8"/>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">行动</text>
  <text x="250" y="355" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">执行决策</text>
  
  <!-- 反思模块 -->
  <rect x="450" y="290" width="200" height="100" fill="#fdebd0" stroke="#333" stroke-width="2" rx="8" ry="8"/>
  <text x="550" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">反思</text>
  <text x="550" y="355" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">评估行动质量</text>
  
  <!-- 输出模块 -->
  <rect x="450" y="140" width="200" height="100" fill="#d7bde2" stroke="#333" stroke-width="2" rx="8" ry="8"/>
  <text x="550" y="175" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">输出</text>
  <text x="550" y="205" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">大模型生成最终结果</text>
  
  <!-- 连接箭头 -->
  <!-- 思考到行动 -->
  <path d="M250 240 L250 290" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">产生决策</text>
  
  <!-- 行动到反思 -->
  <path d="M350 340 L450 340" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">提交评估</text>
  
  <!-- 反思不通过到思考 -->
  <path d="M450 310 L400 310 L400 190 L350 190" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="red">不通过</text>
  
  <!-- 反思通过到输出 -->
  <path d="M550 290 L550 240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="green">通过</text>
  
  <!-- 决策框 -->
  <polygon points="530,290 570,290 550,270" fill="#ff9999" stroke="#333" stroke-width="1.5"/>
  
  <!-- 短期记忆 -->
  <rect x="300" y="450" width="200" height="60" fill="#f2f2f2" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">记忆 (任务轨迹)</text>
  
  <!-- 记忆连接 -->
  <path d="M250 390 L250 450 L300 450" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <path d="M550 390 L550 450 L500 450" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
