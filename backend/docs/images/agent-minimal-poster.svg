<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#112240;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  
  <!-- 主标题 -->
  <g>
    <text x="800" y="300" font-family="'Arial', sans-serif" font-size="100" font-weight="700" fill="#E6F1FF" text-anchor="middle">第九周：Agent</text>
    <line x1="600" y1="340" x2="1000" y2="340" stroke="#64FFDA" stroke-width="2" />
  </g>
  
  <!-- 简约Agent图形 -->
  <g transform="translate(800, 500)">
    <!-- 中心圆形 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#64FFDA" stroke-width="2" />
    <!-- 简单的连接线 -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#64FFDA" stroke-width="1.5" />
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#64FFDA" stroke-width="1.5" />
    <!-- 中心文字 -->
    <text x="0" y="15" font-family="'Arial', sans-serif" font-size="40" font-weight="600" fill="#E6F1FF" text-anchor="middle">Agent</text>
  </g>
  
  <!-- Slogan 设计 - 更简约 -->
  <g>
    <text x="800" y="700" font-family="'Arial', sans-serif" font-size="36" font-weight="500" fill="#E6F1FF" text-anchor="middle">组件化是核心</text>
    <text x="800" y="760" font-family="'Arial', sans-serif" font-size="36" font-weight="500" fill="#E6F1FF" text-anchor="middle">工作流是灵魂</text>
    <line x1="650" y1="790" x2="950" y2="790" stroke="#64FFDA" stroke-width="1" />
  </g>
</svg>
