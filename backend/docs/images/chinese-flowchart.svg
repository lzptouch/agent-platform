<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- 主标题查询框 -->
  <rect x="530" y="40" width="220" height="40" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">硅谷银行发生了什么？</text>
  
  <!-- 箭头从查询指向各个部分 -->
  <line x1="640" y1="80" x2="640" y2="150" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="80" x2="120" y2="140" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="80" x2="950" y2="140" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- 左侧：网络搜索部分 -->
  <rect x="37" y="140" width="180" height="50" rx="5" ry="5" fill="#D3D3D3" stroke="black" stroke-width="1"/>
  <text x="127" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">谷歌搜索</text>
  <text x="127" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">(Serper API)</text>
  
  <line x1="127" y1="190" x2="127" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="62" y="230" width="130" height="30" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="127" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Serper 响应</text>
  
  <rect x="20" y="280" width="235" height="280" rx="0" ry="0" fill="white" stroke="black" stroke-width="1"/>
  <text x="30" y="300" font-family="monospace" font-size="12">[1] {</text>
  <text x="30" y="315" font-family="monospace" font-size="12">"title": "硅谷银行崩溃解释：你需要知道的",</text>
  <text x="30" y="330" font-family="monospace" font-size="12">"link": "https://www.techtarget.com...",</text>
  <text x="30" y="345" font-family="monospace" font-size="12">"snippet": "政府没有救助SVB。它将保持崩溃...",</text>
  <text x="30" y="360" font-family="monospace" font-size="12">"date": "2023年4月20日",</text>
  <text x="30" y="375" font-family="monospace" font-size="12">"position": 1</text>
  <text x="30" y="390" font-family="monospace" font-size="12">},</text>
  <text x="30" y="405" font-family="monospace" font-size="12">[2] {</text>
  <text x="30" y="420" font-family="monospace" font-size="12">"title": "硅谷银行崩溃：它是如何发生的 - CNBC",</text>
  <text x="30" y="435" font-family="monospace" font-size="12">"link": "https://www.cnbc.com/...",</text>
  <text x="30" y="450" font-family="monospace" font-size="12">"snippet": "在48小时内，风投引发的恐慌...",</text>
  <text x="30" y="465" font-family="monospace" font-size="12">"date": "2023年3月10日",</text>
  <text x="30" y="480" font-family="monospace" font-size="12">"position": 2</text>
  <text x="30" y="495" font-family="monospace" font-size="12">},</text>
  <text x="30" y="510" font-family="monospace" font-size="12">...</text>
  
  <!-- 网络抓取部分 -->
  <line x1="180" y1="250" x2="270" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="270" y="140" width="150" height="50" rx="5" ry="5" fill="#D3D3D3" stroke="black" stroke-width="1"/>
  <text x="345" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">BeautifulSoup</text>
  
  <line x1="345" y1="190" x2="345" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="300" y="230" width="90" height="30" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="345" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">网页内容</text>
  
  <rect x="270" y="280" width="215" height="280" rx="0" ry="0" fill="white" stroke="black" stroke-width="1"/>
  <text x="280" y="300" font-family="monospace" font-size="12">网页 [1]:</text>
  <text x="280" y="315" font-family="monospace" font-size="12">硅谷银行以惊人的速度在周五崩溃...</text>
  <text x="280" y="345" font-family="monospace" font-size="12">网页 [2]:</text>
  <text x="280" y="360" font-family="monospace" font-size="12">投资者现在担忧其倒闭可能引发更广泛的</text>
  <text x="280" y="375" font-family="monospace" font-size="12">银行业崩溃...</text>
  <text x="280" y="405" font-family="monospace" font-size="12">网页 [3]:</text>
  <text x="280" y="420" font-family="monospace" font-size="12">美国联邦政府已介入保障客户存款...</text>
  <text x="280" y="450" font-family="monospace" font-size="12">网页 [4]:</text>
  <text x="280" y="465" font-family="monospace" font-size="12">SVB的崩溃继续在全球金融市场引发震荡...</text>
  
  <!-- 语义搜索部分 -->
  <line x1="400" y1="250" x2="500" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="500" y="140" width="150" height="50" rx="5" ry="5" fill="#D3D3D3" stroke="black" stroke-width="1"/>
  <text x="575" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">OpenAI嵌入</text>
  
  <line x1="575" y1="190" x2="575" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="525" y="230" width="100" height="30" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="575" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">分词</text>
  
  <line x1="575" y1="260" x2="575" y2="300" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="525" y="300" width="100" height="30" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="575" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">ChromaDB</text>
  
  <line x1="575" y1="330" x2="575" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="500" y="380" width="150" height="50" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="575" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Top K个最相关</text>
  <text x="575" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">文档</text>
  
  <!-- 下方文档信息 -->
  <rect x="500" y="440" width="215" height="120" rx="0" ry="0" fill="white" stroke="black" stroke-width="1"/>
  <text x="510" y="455" font-family="monospace" font-size="12">来自网页[3], url: https://www.vox.com/...</text>
  <text x="510" y="470" font-family="monospace" font-size="12">硅谷银行的倒闭主要是一场老式银行挤兑...</text>
  <text x="510" y="500" font-family="monospace" font-size="12">来自网页[5], url: https://www.fdic.gov/...</text>
  <text x="510" y="515" font-family="monospace" font-size="12">2023年3月10日周五，位于加州圣克拉拉的</text>
  <text x="510" y="530" font-family="monospace" font-size="12">硅谷银行被加州金融保护与创新部关闭...</text>
  
  <!-- 大语言模型响应部分 -->  
  <rect x="900" y="100" width="150" height="50" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="975" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">提示模板</text>
  
  <rect x="830" y="160" width="220" height="80" rx="0" ry="0" fill="white" stroke="black" stroke-width="1"/>
  <text x="840" y="175" font-family="Arial, sans-serif" font-size="12">指示：你是个AI助手。使用提供的网络</text>
  <text x="840" y="190" font-family="Arial, sans-serif" font-size="12">搜索结果，撰写一个全面而详细的回复</text>
  <text x="840" y="205" font-family="Arial, sans-serif" font-size="12">关于...</text>
  
  <line x1="950" y1="240" x2="950" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="850" y="280" width="200" height="50" rx="5" ry="5" fill="#D3D3D3" stroke="black" stroke-width="1"/>
  <text x="950" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">GPT-3.5-turbo-16k</text>
  <text x="950" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">GPT-4-32k</text>
  
  <rect x="830" y="350" width="200" height="50" rx="5" ry="5" fill="white" stroke="black" stroke-width="1"/>
  <text x="930" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">带引用的GPT回答</text>
  
  <rect x="830" y="410" width="240" height="150" rx="0" ry="0" fill="white" stroke="black" stroke-width="1"/>
  <text x="840" y="425" font-family="Arial, sans-serif" font-size="12">硅谷银行(SVB)在周五以惊人的速度崩溃，</text>
  <text x="840" y="440" font-family="Arial, sans-serif" font-size="12">引发了对更广泛的银行业崩溃的担忧[1]。</text>
  <text x="840" y="455" font-family="Arial, sans-serif" font-size="12">该银行的倒闭在金融市场引发了震荡...</text>
  <text x="840" y="485" font-family="Arial, sans-serif" font-size="12">引用：</text>
  <text x="840" y="500" font-family="Arial, sans-serif" font-size="12">[1] URL: https://www.cnn.com/...</text>
  <text x="840" y="515" font-family="Arial, sans-serif" font-size="12">引用句：硅谷银行以惊人的速度崩溃...</text>
  <text x="840" y="530" font-family="Arial, sans-serif" font-size="12">[2] ...</text>
  
  <!-- 右侧参考来源定位区 -->
  <rect x="1080" y="320" width="160" height="60" rx="5" ry="5" fill="white" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="1160" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">带源信息的</text>
  <text x="1160" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">参考卡片</text>
  
  <line x1="950" y1="350" x2="1080" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- 底部标签 -->
  <text x="120" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16">网络搜索</text>
  <rect x="50" y="610" width="140" height="5" fill="#FFA500" stroke="none"/>
  
  <text x="350" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16">网络爬取</text>
  <rect x="280" y="610" width="140" height="5" fill="#FFA500" stroke="none"/>
  
  <text x="575" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16">语义搜索</text>
  <rect x="505" y="610" width="140" height="5" fill="#FFA500" stroke="none"/>
  
  <text x="950" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16">大语言模型响应</text>
  <rect x="880" y="610" width="140" height="5" fill="#FFA500" stroke="none"/>
  
  <text x="1160" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16">定位参考来源</text>
  <rect x="1090" y="610" width="140" height="5" fill="#FFA500" stroke="none"/>
</svg>
