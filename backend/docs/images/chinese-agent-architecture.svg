<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- 背景 -->
  <rect width="1000" height="600" fill="white"/>
  
  <!-- 中心Agent -->
  <rect x="435" y="270" width="130" height="60" fill="#ffcccc" stroke="#666666" stroke-width="2"/>
  <text x="500" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent</text>
  
  <!-- 记忆模块 -->
  <rect x="435" y="140" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="500" y="175" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">记忆</text>
  
  <!-- 短期记忆 -->
  <rect x="245" y="40" width="190" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="340" y="75" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">短期记忆</text>
  
  <!-- 长期记忆 -->
  <rect x="565" y="40" width="190" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="660" y="75" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">长期记忆</text>
  
  <!-- 工具模块 -->
  <rect x="245" y="270" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="310" y="305" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">工具</text>
  
  <!-- 行动模块 -->
  <rect x="435" y="400" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="500" y="435" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">行动</text>
  
  <!-- 规划模块 -->
  <rect x="625" y="270" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="690" y="305" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">规划</text>
  
  <!-- 反思模块 -->
  <rect x="815" y="200" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="880" y="235" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">反思</text>
  
  <!-- 自我批评 -->
  <rect x="815" y="270" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="880" y="305" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">自我批评</text>
  
  <!-- 思维链 -->
  <rect x="815" y="340" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="880" y="375" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">思维链</text>
  
  <!-- 子目标分解 -->
  <rect x="815" y="410" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="880" y="445" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">子目标分解</text>
  
  <!-- 日历工具 -->
  <rect x="55" y="130" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="120" y="165" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">日历()</text>
  
  <!-- 计算器工具 -->
  <rect x="55" y="200" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="120" y="235" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">计算器()</text>
  
  <!-- 代码解释器工具 -->
  <rect x="55" y="270" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="120" y="305" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">代码解释器()</text>
  
  <!-- 搜索工具 -->
  <rect x="55" y="340" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">搜索()</text>
  
  <!-- 更多工具 -->
  <rect x="55" y="410" width="130" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="120" y="445" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">...更多</text>
  
  <!-- 连接线 - 实线 -->
  <!-- Agent与记忆 -->
  <line x1="500" y1="270" x2="500" y2="200" stroke="#666666" stroke-width="2"/>
  <polygon points="500,200 495,210 505,210" fill="#666666"/>
  
  <!-- 记忆与短期/长期记忆 -->
  <line x1="500" y1="140" x2="500" y2="100" stroke="#666666" stroke-width="2"/>
  <line x1="500" y1="100" x2="340" y2="100" stroke="#666666" stroke-width="2"/>
  <line x1="500" y1="100" x2="660" y2="100" stroke="#666666" stroke-width="2"/>
  <line x1="340" y1="100" x2="340" y2="100" stroke="#666666" stroke-width="2"/>
  <line x1="660" y1="100" x2="660" y2="100" stroke="#666666" stroke-width="2"/>
  <polygon points="340,100 350,95 350,105" fill="#666666"/>
  <polygon points="660,100 650,95 650,105" fill="#666666"/>
  
  <!-- Agent与工具 -->
  <line x1="435" y1="300" x2="375" y2="300" stroke="#666666" stroke-width="2"/>
  <polygon points="375,300 385,295 385,305" fill="#666666"/>
  
  <!-- Agent与行动 -->
  <line x1="500" y1="330" x2="500" y2="400" stroke="#666666" stroke-width="2"/>
  <polygon points="500,400 495,390 505,390" fill="#666666"/>
  
  <!-- Agent与规划 -->
  <line x1="565" y1="300" x2="625" y2="300" stroke="#666666" stroke-width="2"/>
  <polygon points="625,300 615,295 615,305" fill="#666666"/>
  
  <!-- 规划与反思系列 -->
  <line x1="755" y1="300" x2="785" y2="300" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="300" x2="785" y2="230" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="300" x2="785" y2="370" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="440" x2="785" y2="370" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="230" x2="815" y2="230" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="300" x2="815" y2="300" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="370" x2="815" y2="370" stroke="#666666" stroke-width="2"/>
  <line x1="785" y1="440" x2="815" y2="440" stroke="#666666" stroke-width="2"/>
  <polygon points="815,230 805,225 805,235" fill="#666666"/>
  <polygon points="815,300 805,295 805,305" fill="#666666"/>
  <polygon points="815,370 805,365 805,375" fill="#666666"/>
  <polygon points="815,440 805,435 805,445" fill="#666666"/>
  
  <!-- 工具与各工具 -->
  <line x1="245" y1="300" x2="215" y2="300" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="300" x2="215" y2="160" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="300" x2="215" y2="440" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="160" x2="185" y2="160" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="230" x2="185" y2="230" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="300" x2="185" y2="300" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="370" x2="185" y2="370" stroke="#666666" stroke-width="2"/>
  <line x1="215" y1="440" x2="185" y2="440" stroke="#666666" stroke-width="2"/>
  <polygon points="185,160 195,155 195,165" fill="#666666"/>
  <polygon points="185,230 195,225 195,235" fill="#666666"/>
  <polygon points="185,300 195,295 195,305" fill="#666666"/>
  <polygon points="185,370 195,365 195,375" fill="#666666"/>
  <polygon points="185,440 195,435 195,445" fill="#666666"/>
  
  <!-- 连接线 - 虚线 -->
  <!-- 记忆与规划 -->
  <line x1="565" y1="170" x2="690" y2="170" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="690" y1="170" x2="690" y2="270" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="690,270 685,260 695,260" fill="#666666" stroke="#666666" stroke-width="1"/>
  
  <!-- 工具与行动 -->
  <line x1="310" y1="330" x2="310" y2="430" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="310" y1="430" x2="435" y2="430" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="435,430 425,425 425,435" fill="#666666" stroke="#666666" stroke-width="1"/>
</svg>
