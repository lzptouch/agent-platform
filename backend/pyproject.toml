[project]
name = "agent"
version = "0.1.0"
description = "统一 Agent 平台：MCP 协议 + Skill 体系 + RAG + Web Research"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 配置与校验
    "pydantic>=2.7,<2.12",
    "pydantic-settings>=2.3,<2.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # LLM 客户端
    "anthropic>=0.52.0",
    "openai>=1.58",
    # MCP SDK
    "mcp[cli]>=1.6.0,<2.0.0",
    "fastmcp==2.5.2",
    "httpx>=0.28.0",
    "requests>=2.32",
    # 浏览器自动化（小红书 MCP Server）
    "playwright>=1.40.0",
    # Skill 运行时库
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    # RAG / 向量库（Embedding 走 DashScope API，稀疏向量用 Milvus 内置 BM25 Function，无需本地模型）
    "pymilvus>=2.5,<2.6",
    "milvus-lite>=2.5,<2.6",
    # Web Research 链路
    "chromadb>=0.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1.2",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "setuptools<81",
    # 数据层与调度（与 requirements.txt 保持一致）
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "apscheduler>=3.10,<4.0",
    # 开发 / 测试
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 隔离临时目录：避免与其它项目共用系统 basetemp 时互相删除（pytest 会 GC 旧目录）
addopts = "--basetemp=.pytest_tmp"
markers = [
    "unit: 纯函数 / 单类单元测试",
    "integration: 依赖 DB、调度、子进程的集成测试",
    "e2e: 端到端测试",
]
